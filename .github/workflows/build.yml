name: Build and Release ESP32 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.1.1
        target: esp32

    - name: Build firmware
      run: |
        source $IDF_PATH/export.sh
        idf.py build

    - name: Extract version
      id: version
      run: |
        # Extract version from the main CMakeLists.txt
        VERSION=$(grep -oP 'set\(PROJECT_VER "\K[^"]*' CMakeLists.txt || echo "1.0.0")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Find and prepare firmware.bin
      run: |
        # Look for the main application binary
        echo "=== Searching for firmware binary ==="
        
        # Common patterns for the main application binary
        if [ -f "build/esp32_auto_ota.bin" ]; then
          cp build/esp32_auto_ota.bin firmware.bin
          echo "Found: esp32_auto_ota.bin"
        elif [ -f "build/esp32-auto-ota.bin" ]; then
          cp build/esp32-auto-ota.bin firmware.bin
          echo "Found: esp32-auto-ota.bin"
        elif [ -f "build/main.bin" ]; then
          cp build/main.bin firmware.bin
          echo "Found: main.bin"
        else
          # List all binaries to help debug
          echo "Available .bin files in build directory:"
          find build -name "*.bin" -type f
          
          # Try to find the app binary by excluding common files
          APP_BIN=$(find build -name "*.bin" -type f | grep -v bootloader | grep -v partition-table | grep -v ota_data | head -1)
          if [ -n "$APP_BIN" ]; then
            cp "$APP_BIN" firmware.bin
            echo "Found: $(basename $APP_BIN)"
          else
            echo "ERROR: Could not find main application binary!"
            exit 1
          fi
        fi
        
        # Verify the file exists and get its size
        if [ -f "firmware.bin" ]; then
          echo "Firmware size: $(ls -lh firmware.bin | awk '{print $5}')"
        else
          echo "ERROR: firmware.bin was not created!"
          exit 1
        fi

    - name: Create Release and Upload firmware.bin
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          # ESP32 Auto-OTA Firmware
          
          **Version:** ${{ steps.version.outputs.version }}
          **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Installation
          
          ESP32 devices with the OTA update mechanism will automatically download and install this firmware when available.
          
          ## Manual Flash
          
          If flashing manually, use:
          ```bash
          esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 921600 \
            write_flash 0x10000 firmware.bin
          ```
        files: firmware.bin
        draft: false
        prerelease: false

    - name: Upload firmware as artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-v${{ steps.version.outputs.version }}
        path: firmware.bin
        retention-days: 7
