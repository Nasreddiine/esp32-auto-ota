name: Build and Release ESP32 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ESP-IDF
      run: |
        python -m pip install --upgrade pip
        pip install esptool
        git clone --recursive https://github.com/espressif/esp-idf.git
        cd esp-idf
        git checkout v5.1.1
        ./install.sh esp32
        . ./export.sh

    - name: Build firmware
      run: |
        # Source ESP-IDF environment
        . /home/runner/esp-idf/export.sh
        # Build the project
        idf.py build
        echo "=== Build output ==="
        find build -name "*.bin" -type f

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep -oP 'set\(PROJECT_VER "\K[^"]*' CMakeLists.txt || echo "1.0.0")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Prepare firmware
      run: |
        # Copy the main application binary
        if [ -f "build/esp32_auto_ota.bin" ]; then
          cp build/esp32_auto_ota.bin firmware.bin
        elif [ -f "build/esp32-auto-ota.bin" ]; then
          cp build/esp32-auto-ota.bin firmware.bin
        else
          find build -name "*.bin" -type f | grep -v bootloader | grep -v partition-table | grep -v ota_data | head -1 | xargs -I {} cp {} firmware.bin
        fi
        
        if [ ! -f "firmware.bin" ]; then
          echo "ERROR: No firmware.bin found!"
          find build -type f -name "*.bin"
          exit 1
        fi
        echo "Firmware ready: $(ls -lh firmware.bin)"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ESP32 Auto-OTA Firmware v${{ steps.version.outputs.version }}
          Built: $(date -u)
        files: firmware.bin

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: firmware.bin
